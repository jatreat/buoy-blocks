:root{--ink:#14303F;--cream:#FFF8EC;--display:"Fredoka",system-ui,sans-serif;--ui:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden;background:#0F4E63;color:#fff;font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.btns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(9,40,56,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff}
.icon-btn svg{width:22px;height:22px}
#scoreBox{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translateX(-50%);text-align:center;pointer-events:none;z-index:3}
#score{display:block;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
#best{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 11px 3px 7px;border-radius:999px;background:rgba(9,40,56,.5);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
#best svg{width:16px;height:16px}
#hint{position:absolute;pointer-events:none;z-index:4;left:0;top:0}
#hand{position:absolute;width:56px;height:56px;margin:-6px 0 0 -18px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#hand svg{display:block;width:100%;height:100%}
#hintText{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;padding:9px 16px 10px;border-radius:14px;background:#FFF8EC;color:var(--ink);font-family:var(--display);font-weight:700;font-size:19px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.25)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);max-width:calc(100% - 24px);padding:9px 15px;border-radius:13px;background:rgba(8,24,34,.9);font-weight:900;font-size:15px;line-height:1.25;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(5,28,40,.55);z-index:10}
.card{width:min(360px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px 20px 18px;border-radius:24px;background:#FFF8EC;color:var(--ink);text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
.card.wide{width:min(560px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1}
.card p{margin:0 0 12px;font-weight:800;font-size:15.5px;line-height:1.35;color:#3A5260}
.card .big{margin:2px 0 4px;font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:#14303F;font-variant-numeric:tabular-nums}
.card .sub{margin:0 0 14px;font-weight:900;font-size:15px;color:#56707E}
.badge{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;background:#FFD24A;color:#5A3D00;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mbtns{display:flex;flex-direction:column;gap:10px}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:#fff;background:#2E8B87;box-shadow:0 4px 0 #1C5F5C}
.mb:active{transform:translateY(3px);box-shadow:0 1px 0 #1C5F5C}
.mb.ad{background:#F2A532;box-shadow:0 4px 0 #A9741A;color:#3B2600}
.mb.ad:active{box-shadow:0 1px 0 #A9741A}
.mb.ghost{background:transparent;color:#4E6A78;box-shadow:none;min-height:40px;font-size:16px}
.mb.warn{background:#D9573F;box-shadow:0 4px 0 #8E2F1E}
.mb svg{width:24px;height:24px;flex:none}
.mb small{display:block;font-size:12px;font-weight:800;opacity:.85}
.mb:disabled{opacity:.45;cursor:default}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.theme{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 8px 10px;border:0;border-radius:16px;background:#F1E8D8;color:var(--ink);font:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(20,48,63,.08);text-align:left}
.theme canvas{width:100%;aspect-ratio:16/10;border-radius:10px;display:block}
.theme b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;padding:0 2px}
.theme small{font-size:12px;font-weight:800;color:#6A7E88;padding:0 2px}
.theme.on{background:#DDF1EC;box-shadow:inset 0 0 0 3px #2E8B87}
.theme.locked canvas{filter:saturate(.25) brightness(.85)}
#adFake{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#fff;font-weight:900;font-size:18px;z-index:20;letter-spacing:.06em}
.cover #hud,.cover #scoreBox,.cover #hint,.cover #toast{display:none !important}
</style>

<script>
/* Buoy Blocks: board rules, piece set, dealer and scoring (no DOM).
   The 8x8 board is 8 row bitmasks (bit c = column c); colours live in a separate array. */
var BB = (function () {
  "use strict";
  var N = 8, FULL = 255;

  function mulberry32(seed) {
    var s = seed >>> 0;
    var f = function () {
      s = (s + 0x6D2B79F5) >>> 0; var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.state = function () { return s; };
    return f;
  }

        c.lineJoin = "round"; c.lineWidth = fsz * 0.17; c.strokeStyle = "#0E3A4C";
        c.save(); c.translate(0, fsz * 0.085); c.strokeText(ln, tx, yy); c.fillStyle = "#0E3A4C"; c.fillText(ln, tx, yy); c.restore();
        c.strokeText(ln, tx, yy);
        var g = c.createLinearGradient(0, yy, 0, yy + fsz);
        if (i === 0 && !sq) { g.addColorStop(0, "#FFFFFF"); g.addColorStop(1, "#FFE9C6"); } else { g.addColorStop(0, "#FFD25E"); g.addColorStop(1, "#FF8A3D"); }
        c.fillStyle = g; c.fillText(ln, tx, yy);
      });
    }
    paint();
    requestAnimationFrame(paint);
  }

  if (DEBUG) window.__bb = {
    state: function () { var g = G.g; return { score: g.score, best: S.best, over: g.over, state: G.state, moves: g.moves, lines: g.lines, rows: g.rows.slice(), revived: g.revived, modal: !$("modal").hidden,
      pieces: g.pieces.map(function (p) { return { id: p.s.id, used: p.used, fits: BB.anyFit(g.rows, p.s) }; }) }; },
    geo: function () { return { ix: L.ix, iy: L.iy, cell: L.cell, slots: L.slots, ts: L.ts }; },
    place: function (k, r, c) { if (G.state !== "play") return false; if (G.firstMove) { G.firstMove = false; gameplay(true); } return doMove(k, r, c); },
    newGame: function (seed) { startGame(seed); },
    set: function (o) { Object.assign(S, o); bgCache = null; boardCache = null; updateHUD(); },
    S: function () { return S; },
    G: function () { return G.g; },
    drag: function () { return G.drag ? { k: G.drag.k, x: G.drag.x, y: G.drag.y, lift: G.drag.lift, scale: G.drag.scale, tl: dragTopLeft() } : null; },
    sfx: function (k) { audioInit(); sfx(k, { lines: 3, combo: 2 }); return !!AC && AC.state; }
  };
  boot();
})();
